<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Sepuri Sai Krishna — terminal session</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="958" height="278" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect x="0" y="0" width="960" height="280" fill="url(#bgGrad)"/>
    <circle cx="872" cy="36" r="100" fill="#38bdf8" opacity="0.16" filter="url(#glow)"/>
    <circle cx="48" cy="268" r="110" fill="#818cf8" opacity="0.14" filter="url(#glow)"/>

    <!-- terminal chrome -->
    <rect x="0" y="0" width="960" height="40" fill="#ffffff" opacity="0.03"/>
    <line x1="0" y1="40" x2="960" y2="40" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="28" cy="20" r="6" fill="#ef4444"/>
    <circle cx="48" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="20" r="6" fill="#22c55e"/>
    <text x="96" y="25" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#64748b">sepuri@github:~</text>
    <text x="864" y="25" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#334155" text-anchor="end">zsh</text>

    <!-- line 1 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.2s" fill="freeze"/>
      <text x="36" y="80" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#34d399">$ whoami</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.3s" fill="freeze"/>
      <text x="36" y="106" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#e2e8f0">Sepuri Sai Krishna <tspan fill="#64748b">·</tspan> <tspan fill="url(#nameGrad)" font-weight="700">Senior Data Engineer</tspan> @ Perfios</text>
    </g>

    <!-- line 2 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.2s" fill="freeze"/>
      <text x="36" y="144" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#34d399">$ cat focus.log</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>
      <text x="36" y="170" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#e2e8f0">Real-time data systems <tspan fill="#64748b">·</tspan> AI agents <tspan fill="#64748b">·</tspan> MCP <tspan fill="#64748b">·</tspan> 850+ Airflow DAGs</text>
    </g>

    <!-- line 3 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.2s" fill="freeze"/>
      <text x="36" y="208" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#34d399">$ curl sepurisaikrishna.com/status</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.25s" dur="0.3s" fill="freeze"/>
      <circle cx="42" cy="233" r="4" fill="#34d399"/>
      <circle cx="42" cy="233" r="4" fill="none" stroke="#34d399" stroke-width="1.5">
        <animate attributeName="r" values="4;13" dur="1.8s" begin="2.55s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="1.8s" begin="2.55s" repeatCount="indefinite"/>
      </circle>
      <text x="56" y="238" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#e2e8f0">200 OK <tspan fill="#64748b">·</tspan> online <tspan fill="#64748b">·</tspan> usually replies within a day</text>
      <rect x="536" y="224" width="9" height="17" fill="#e2e8f0">
        <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="2.55s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <rect x="1" y="1" width="958" height="278" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>

<svg width="960" height="150" viewBox="0 0 960 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="impactTitle">
  <title id="impactTitle">Impact at a glance</title>
  <defs>
    <linearGradient id="numGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="960" height="150" fill="#0b1120"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <!-- card 1 -->
    <rect x="8" y="8" width="222" height="134" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="32" y="64" font-size="34" font-weight="700" fill="url(#numGrad)">850+</text>
    <text x="32" y="90" font-size="14" fill="#cbd5e1">Airflow DAGs</text>
    <text x="32" y="110" font-size="12" fill="#34d399">with RBAC, −90% manual work</text>

    <!-- card 2 -->
    <rect x="246" y="8" width="222" height="134" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="270" y="64" font-size="34" font-weight="700" fill="url(#numGrad)">350M+</text>
    <text x="270" y="90" font-size="14" fill="#cbd5e1">ClickHouse records</text>
    <text x="270" y="110" font-size="12" fill="#34d399">90% faster queries</text>

    <!-- card 3 -->
    <rect x="484" y="8" width="222" height="134" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="508" y="64" font-size="34" font-weight="700" fill="url(#numGrad)">95%</text>
    <text x="508" y="90" font-size="14" fill="#cbd5e1">fewer Spark jobs</text>
    <text x="508" y="110" font-size="12" fill="#34d399">real-time stitch framework</text>

    <!-- card 4 -->
    <rect x="722" y="8" width="230" height="134" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="746" y="64" font-size="34" font-weight="700" fill="url(#numGrad)">8+</text>
    <text x="746" y="90" font-size="14" fill="#cbd5e1">serverless APIs in prod</text>
    <text x="746" y="110" font-size="12" fill="#34d399">AU Bank, Kotak, Axis</text>
  </g>
</svg>

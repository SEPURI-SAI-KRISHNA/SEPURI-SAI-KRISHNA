name: Refresh OSS Contributions

on:
  schedule:
    - cron: "0 3 1 * *"    # monthly, 1st at 03:00 UTC
  workflow_dispatch:         # run manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update contribution tables in README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python .github/scripts/update_oss_contributions.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh OSS contributions" || echo "nothing to commit"
          git push

name: Metrics

on:
  schedule:
    - cron: "15 0 * * *"    # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # default token — no PAT needed
          user: SEPURI-SAI-KRISHNA
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_notable: yes            # org logos of repos you've contributed to (apple, etc.)
          plugin_notable_repositories: yes
          plugin_leetcode: yes
          plugin_leetcode_user: sai_krishna123
          plugin_leetcode_sections: solved, skills
          plugins_errors_fatal: no       # a flaky plugin (e.g. LeetCode API) won't fail the whole run
          output_action: commit
          committer_branch: main
